<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHB Quiz — Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --red: #C8102E;
    --red-dark: #9b0d22;
    --gold: #F5A623;
    --white: #FFFFFF;
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1e1e2a;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --text-muted: #888;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display:flex; flex-direction:column;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background: radial-gradient(ellipse at 30% 70%, rgba(200,16,46,0.1) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }
  .wrap { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; padding:20px; max-width:500px; margin:0 auto; width:100%; }

  /* JOIN */
  #join-screen {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px;
  }
  .logo-big {
    text-align:center;
  }
  .logo-icon {
    width:72px; height:72px; background:var(--red); border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:36px; color:#fff;
    margin:0 auto 12px;
  }
  .logo-title { font-family:'Bebas Neue'; font-size:32px; letter-spacing:3px; }

  .join-form { width:100%; display:flex; flex-direction:column; gap:12px; }
  .input-group { display:flex; flex-direction:column; gap:6px; }
  .input-label { font-size:12px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; }
  .input-field {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px;
    color:var(--white); font-size:16px; font-family:'Be Vietnam Pro';
    outline:none; transition: border-color 0.2s;
  }
  .input-field:focus { border-color:var(--red); }
  .btn-join {
    background:var(--red); color:#fff; border:none; border-radius:10px;
    padding:16px; font-size:17px; font-weight:800; cursor:pointer;
    font-family:'Be Vietnam Pro'; margin-top:8px;
    transition: all 0.2s;
  }
  .btn-join:hover { background:var(--red-dark); }
  .btn-join:disabled { opacity:0.4; cursor:not-allowed; }

  /* LOBBY */
  #lobby-screen { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; }
  .lobby-icon { font-size:64px; }
  .lobby-name { font-family:'Bebas Neue'; font-size:36px; color:var(--gold); }
  .lobby-wait { color:var(--text-muted); font-size:15px; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* QUESTION */
  #question-screen { display:none; flex:1; flex-direction:column; gap:16px; }

  .timer-arc {
    text-align:center; padding:16px 0;
  }
  .timer-big { font-family:'Bebas Neue'; font-size:64px; color:var(--white); line-height:1; }
  .timer-big.warning { color:var(--gold); }

  .timer-bar-wrap { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .timer-bar { height:100%; background:var(--red); border-radius:3px; transition:width 1s linear, background 0.5s; }
  .timer-bar.warning { background:var(--gold); }

  .q-info { display:flex; justify-content:space-between; align-items:center; }
  .q-num { font-size:13px; color:var(--text-muted); }
  .q-type { font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px; }
  .q-type.basic { color:var(--red); background:rgba(200,16,46,0.15); }
  .q-type.advanced { color:var(--gold); background:rgba(245,166,35,0.15); }

  .q-text {
    background:var(--surface); border-radius:14px; padding:20px;
    font-size:15px; font-weight:600; line-height:1.6; text-align:center;
    border:1px solid var(--border); flex:1;
  }

  .ans-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ans-btn {
    border-radius:14px; padding:18px 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; border:2px solid transparent; cursor:pointer;
    transition: all 0.15s; min-height:80px;
    font-family:'Be Vietnam Pro';
  }
  .ans-btn:active { transform:scale(0.96); }
  .ans-btn.A { background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.4); }
  .ans-btn.B { background:rgba(59,130,246,0.15); border-color:rgba(59,130,246,0.4); }
  .ans-btn.C { background:rgba(234,179,8,0.15); border-color:rgba(234,179,8,0.4); }
  .ans-btn.D { background:rgba(34,197,94,0.15); border-color:rgba(34,197,94,0.4); }
  .ans-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .ans-btn.selected.A { background:rgba(239,68,68,0.4); border-color:rgb(239,68,68); }
  .ans-btn.selected.B { background:rgba(59,130,246,0.4); border-color:rgb(59,130,246); }
  .ans-btn.selected.C { background:rgba(234,179,8,0.4); border-color:rgb(234,179,8); }
  .ans-btn.selected.D { background:rgba(34,197,94,0.4); border-color:rgb(34,197,94); }

  .ans-label {
    width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:16px;
  }
  .ans-btn.A .ans-label { background:rgb(239,68,68); }
  .ans-btn.B .ans-label { background:rgb(59,130,246); }
  .ans-btn.C .ans-label { background:rgb(234,179,8); color:#000; }
  .ans-btn.D .ans-label { background:rgb(34,197,94); color:#000; }
  .ans-text { font-size:12px; font-weight:600; text-align:center; line-height:1.3; color:var(--text); }

  /* WAIT */
  #wait-screen { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; }
  .wait-check { font-size:72px; animation:popIn 0.4s ease; }
  @keyframes popIn { from{transform:scale(0);} to{transform:scale(1);} }
  .wait-score { font-family:'Bebas Neue'; font-size:48px; color:var(--gold); }
  .wait-label { color:var(--text-muted); font-size:14px; }
  .wait-hint { font-size:13px; color:var(--text-muted); }
  .pulse { animation:pulse 2s infinite; }

  /* LEADERBOARD */
  #lb-screen { display:none; flex:1; flex-direction:column; gap:20px; padding:20px 0; }
  .lb-title { font-family:'Bebas Neue'; font-size:32px; color:var(--gold); text-align:center; letter-spacing:2px; }
  .lb-row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:10px; background:var(--surface2); margin-bottom:8px; }
  .lb-row.me { border:2px solid var(--red); }
  .lb-rank { font-family:'Bebas Neue'; font-size:20px; width:28px; text-align:center; }
  .lb-name { flex:1; font-weight:600; font-size:14px; }
  .lb-score { font-family:'Bebas Neue'; font-size:20px; color:var(--gold); }

  /* FINAL */
  #final-screen { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; }
  .final-medal { font-size:80px; }
  .final-title { font-family:'Bebas Neue'; font-size:48px; color:var(--gold); }
  .final-score { font-size:16px; color:var(--text-muted); }
  .final-score span { color:var(--white); font-weight:700; font-size:24px; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); padding:10px 20px; border-radius:10px; font-size:13px; opacity:0; transition:opacity 0.3s; z-index:999; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">

  <!-- JOIN -->
  <div id="join-screen">
    <div class="logo-big">
      <div class="logo-icon">SHB</div>
      <div class="logo-title">Quiz Challenge</div>
    </div>
    <div class="join-form">
      <div class="input-group">
        <div class="input-label">Họ và Tên</div>
        <input type="text" class="input-field" id="name-input" placeholder="Nhập tên của bạn..." maxlength="30">
      </div>
      <div class="input-group">
        <div class="input-label">Mã Phòng (PIN)</div>
        <input type="text" class="input-field" id="pin-input" placeholder="Nhập mã 4 chữ số..." maxlength="4" inputmode="numeric">
      </div>
      <button class="btn-join" id="btn-join" onclick="joinGame()">Tham gia →</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby-screen">
    <div class="lobby-icon">⏳</div>
    <div class="lobby-name" id="lobby-name">Xin chào!</div>
    <div class="lobby-wait pulse">Đang chờ host bắt đầu...</div>
  </div>

  <!-- QUESTION -->
  <div id="question-screen">
    <div class="q-info">
      <div class="q-num" id="p-q-counter">Câu 1/10</div>
      <div class="q-type basic" id="p-q-type">CƠ BẢN</div>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="p-timer-bar" style="width:100%"></div>
    </div>
    <div class="timer-arc">
      <div class="timer-big" id="p-timer">15</div>
    </div>
    <div class="q-text" id="p-q-text">Đang tải...</div>
    <div class="ans-grid">
      <button class="ans-btn A" onclick="submitAnswer('A')"><div class="ans-label">A</div><div class="ans-text" id="p-ans-A"></div></button>
      <button class="ans-btn B" onclick="submitAnswer('B')"><div class="ans-label">B</div><div class="ans-text" id="p-ans-B"></div></button>
      <button class="ans-btn C" onclick="submitAnswer('C')"><div class="ans-label">C</div><div class="ans-text" id="p-ans-C"></div></button>
      <button class="ans-btn D" onclick="submitAnswer('D')"><div class="ans-label">D</div><div class="ans-text" id="p-ans-D"></div></button>
    </div>
  </div>

  <!-- WAIT AFTER ANSWER -->
  <div id="wait-screen">
    <div class="wait-check">✅</div>
    <div class="wait-score" id="wait-score">+0</div>
    <div class="wait-label">điểm câu này</div>
    <div class="wait-hint pulse">Chờ host chuyển câu...</div>
  </div>

  <!-- LEADERBOARD between sessions -->
  <div id="lb-screen">
    <div class="lb-title">🏆 Bảng Xếp Hạng</div>
    <div id="p-lb-list"></div>
  </div>

  <!-- FINAL -->
  <div id="final-screen">
    <div class="final-medal" id="final-medal">🎉</div>
    <div class="final-title">KẾT THÚC!</div>
    <div class="final-score">Tổng điểm của bạn: <br><span id="final-score-val">0</span> điểm</div>
    <div id="final-rank" style="color:var(--text-muted); margin-top:8px;"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://bqvpdddmgkjreqwcomav.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Iq4aS_moYquCQhU1XpwJew_F9kwtOBm';
const CSV_COBAN = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJ4_gYsguWuoOOf9fqqFDlA_QkwDGnhQKmCIfia44Mx-jykPRnjqKqRMz-A4SBsV9qRvfGy7xgM5Yh/pub?gid=0&single=true&output=csv';
const CSV_NANGCAO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJ4_gYsguWuoOOf9fqqFDlA_QkwDGnhQKmCIfia44Mx-jykPRnjqKqRMz-A4SBsV9qRvfGy7xgM5Yh/pub?gid=730343802&single=true&output=csv';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let playerId = '';
let playerName = '';
let currentState = null;
let questions = { coban: [], nangcao: [] };
let sessionQuestions = [];
let timerInterval = null;
let timeLeft = 15;
let questionStartTime = null;
let hasAnswered = false;
let myScore = 0;
let stateInterval = null;
let lastQuestionIndex = -1;
let lastSession = -1;

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/"/g,''));
    const obj = {};
    headers.forEach((h,i) => obj[h] = vals[i] || '');
    return obj;
  }).filter(q => q.id && q.question);
}

async function loadQuestions() {
  const [r1, r2] = await Promise.all([
    fetch(CSV_COBAN).then(r => r.text()),
    fetch(CSV_NANGCAO).then(r => r.text())
  ]);
  questions.coban = parseCSV(r1);
  questions.nangcao = parseCSV(r2);
}

// Deterministic shuffle using session as seed (same as host)
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length-1; i>0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i+1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function joinGame() {
  const name = document.getElementById('name-input').value.trim();
  const pin = document.getElementById('pin-input').value.trim();

  if (!name) { showToast('Vui lòng nhập tên!'); return; }
  if (!pin) { showToast('Vui lòng nhập mã phòng!'); return; }

  // Check pin
  const { data: state } = await db.from('game_state').select('*').eq('id','current').single();
  if (!state || state.pin !== pin) {
    showToast('❌ Mã phòng không đúng!');
    return;
  }
  if (state.status !== 'lobby') {
    showToast('❌ Game đã bắt đầu rồi!');
    return;
  }

  playerId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
  playerName = name;

  await db.from('players').upsert({ id: playerId, name: playerName, score: 0 });

  document.getElementById('lobby-name').textContent = `Xin chào, ${playerName}!`;

  showScreen('lobby-screen');
  await loadQuestions();
  startStatePolling();
}

function startStatePolling() {
  stateInterval = setInterval(async () => {
    const { data: state } = await db.from('game_state').select('*').eq('id','current').single();
    if (!state) return;

    if (state.status === 'question') {
      const sessionChanged = state.session !== lastSession;
      const questionChanged = state.question_index !== lastQuestionIndex;

      if (questionChanged || sessionChanged) {
        lastQuestionIndex = state.question_index;
        lastSession = state.session;
        hasAnswered = false;
        questionStartTime = new Date(state.question_started_at).getTime();
        buildSessionQuestions(state.session);
        showQuestion(state.question_index);
      }
    } else if (state.status === 'result' && !hasAnswered) {
      // Show wait screen if haven't answered yet
      if (document.getElementById('question-screen').style.display !== 'none') {
        clearInterval(timerInterval);
        showWait(0);
      }
    } else if (state.status === 'lobby' && lastSession > 0) {
      showScreen('lobby-screen');
      document.querySelector('.lobby-wait').textContent = 'Chờ Session 2 bắt đầu...';
    } else if (state.status === 'final') {
      showFinal();
    }
  }, 1500);
}

function buildSessionQuestions(session) {
  // Use same seed as host (based on session number for consistency)
  const seed = session * 12345;
  const coban = seededShuffle(questions.coban, seed).slice(0,8);
  const nangcao = seededShuffle(questions.nangcao, seed+1).slice(0,2);
  sessionQuestions = seededShuffle([...coban, ...nangcao], seed+2);
}

function showQuestion(index) {
  clearInterval(timerInterval);
  const q = sessionQuestions[index];
  if (!q) return;

  const isAdvanced = index >= 8;
  document.getElementById('p-q-counter').textContent = `Câu ${index+1}/10`;
  document.getElementById('p-q-type').textContent = isAdvanced ? '⭐ NÂNG CAO' : 'CƠ BẢN';
  document.getElementById('p-q-type').className = `q-type ${isAdvanced ? 'advanced' : 'basic'}`;
  document.getElementById('p-q-text').textContent = q.question;
  document.getElementById('p-ans-A').textContent = q.A;
  document.getElementById('p-ans-B').textContent = q.B;
  document.getElementById('p-ans-C').textContent = q.C;
  document.getElementById('p-ans-D').textContent = q.D;

  // Enable buttons
  document.querySelectorAll('.ans-btn').forEach(b => {
    b.disabled = false;
    b.classList.remove('selected');
  });

  showScreen('question-screen');
  startPlayerTimer();
}

function startPlayerTimer() {
  timeLeft = 15;
  const bar = document.getElementById('p-timer-bar');
  const num = document.getElementById('p-timer');
  bar.style.width = '100%';
  bar.className = 'timer-bar';
  num.className = 'timer-big';

  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - questionStartTime) / 1000;
    timeLeft = Math.max(0, 15 - elapsed);
    bar.style.width = (timeLeft/15*100) + '%';
    num.textContent = Math.ceil(timeLeft);

    if (timeLeft <= 5) {
      bar.className = 'timer-bar warning';
      num.className = 'timer-big warning';
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!hasAnswered) showWait(0);
    }
  }, 200);
}

async function submitAnswer(choice) {
  if (hasAnswered) return;
  hasAnswered = true;
  clearInterval(timerInterval);

  const elapsed = (Date.now() - questionStartTime) / 1000;
  const q = sessionQuestions[lastQuestionIndex];
  let score = 0;

  if (choice === q.answer) {
    if (elapsed < 5) score = 2;
    else if (elapsed < 10) score = 1.75;
    else score = 1.5;
  }

  myScore += score;

  // Highlight selected
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
  document.querySelector(`.ans-btn.${choice}`).classList.add('selected');

  // Save answer
  await db.from('answers').insert({
    player_id: playerId,
    session: lastSession,
    question_index: lastQuestionIndex,
    answer: choice,
    answered_at: elapsed,
    score: score
  });

  // Update player score
  await db.from('players').update({ score: myScore }).eq('id', playerId);

  setTimeout(() => showWait(score), 400);
}

function showWait(score) {
  document.getElementById('wait-score').textContent = `+${score.toFixed(2)}`;
  showScreen('wait-screen');
}

async function showFinal() {
  clearInterval(stateInterval);
  const { data: lb } = await db.from('players').select('*').order('score', { ascending:false });
  const rank = lb ? lb.findIndex(p => p.id === playerId) + 1 : 0;
  const medals = ['🥇','🥈','🥉'];

  document.getElementById('final-medal').textContent = medals[rank-1] || '🎉';
  document.getElementById('final-score-val').textContent = myScore.toFixed(2);
  document.getElementById('final-rank').textContent = `Xếp hạng: ${rank}/${lb?.length || 0}`;
  showScreen('final-screen');
}

function showScreen(id) {
  ['join-screen','lobby-screen','question-screen','wait-screen','lb-screen','final-screen'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = 'flex';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Auto-fill PIN from URL
const urlPin = new URLSearchParams(window.location.search).get('pin');
if (urlPin) document.getElementById('pin-input').value = urlPin;
</script>
</body>
</html>
