document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\u002Fspan><\u002Fdiv>\n      <div class=\"abtn C\"><span class=\"albl\">C<\u002Fspan><span id=\"a-C\"><\u002Fspan><\u002Fdiv>\n      <div class=\"abtn D\"><span class=\"albl\">D<\u002Fspan><span id=\"a-D\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"s-result\">\n    <div class=\"distbox\">\n      <div class=\"dist-ttl\">Phân bố câu trả lời<\u002Fdiv>\n      <div class=\"dbars\">\n        <div class=\"dbar-w\"><div class=\"dbar A\" id=\"bar-A\" style=\"height:0\"><\u002Fdiv><div class=\"dlbl\">A<\u002Fdiv><div class=\"dcnt\" id=\"cnt-A\">0<\u002Fdiv><\u002Fdiv>\n        <div class=\"dbar-w\"><div class=\"dbar B\" id=\"bar-B\" style=\"height:0\"><\u002Fdiv><div class=\"dlbl\">B<\u002Fdiv><div class=\"dcnt\" id=\"cnt-B\">0<\u002Fdiv><\u002Fdiv>\n        <div class=\"dbar-w\"><div class=\"dbar C\" id=\"bar-C\" style=\"height:0\"><\u002Fdiv><div class=\"dlbl\">C<\u002Fdiv><div class=\"dcnt\" id=\"cnt-C\">0<\u002Fdiv><\u002Fdiv>\n        <div class=\"dbar-w\"><div class=\"dbar D\" id=\"bar-D\" style=\"height:0\"><\u002Fdiv><div class=\"dlbl\">D<\u002Fdiv><div class=\"dcnt\" id=\"cnt-D\">0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lbbox\"><div class=\"lb-ttl\">🏆 Bảng Xếp Hạng<\u002Fdiv><div id=\"lb-mid\"><\u002Fdiv><\u002Fdiv>\n    <button class=\"btn-next\" id=\"btn-next\" onclick=\"nextQ()\">Câu tiếp theo ▶<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div id=\"s-final\">\n    <div class=\"final-ttl\">🏆 Kết quả cuối cùng<\u002Fdiv>\n    <div class=\"final-sub\">Vòng thi kết thúc — 2 Session hoàn thành<\u002Fdiv>\n    <div class=\"lbbox\"><div class=\"lb-ttl\">Bảng Xếp Hạng Chung Cuộc<\u002Fdiv><div id=\"lb-final\"><\u002Fdiv><\u002Fdiv>\n    <button class=\"btn-gold\" onclick=\"exportCSV()\">📥 Xuất kết quả CSV<\u002Fbutton>\n    <button class=\"btn-gray\" onclick=\"resetGame()\">🔄 Tạo game mới<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<script>\nconst SB_URL = 'https://bqvpdddmgkjreqwcomav.supabase.co';\nconst SB_KEY = 'sb_publishable_Iq4aS_moYquCQhU1XpwJew_F9kwtOBm';\nconst TSV_CB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJ4_gYsguWuoOOf9fqqFDlA_QkwDGnhQKmCIfia44Mx-jykPRnjqKqRMz-A4SBsV9qRvfGy7xgM5Yh/pub?gid=0&single=true&output=tsv';\nconst TSV_NC = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJ4_gYsguWuoOOf9fqqFDlA_QkwDGnhQKmCIfia44Mx-jykPRnjqKqRMz-A4SBsV9qRvfGy7xgM5Yh/pub?gid=730343802&single=true&output=tsv';\nconst CD_SECS = 3;\n\nconst {createClient} = supabase;\nconst db = createClient(SB_URL, SB_KEY);\n\nlet qBank={cb:[],nc:[]}, sessQs=[], curIdx=0, curSess=1;\nlet timerInt=null, pollInt=null, ansInt=null, cdInt=null;\nlet tLeft=15, players=[], pin='';\n\nfunction parseTSV(text) {\n  const lines = text.replace(/\\r\\n/g,'\\n').replace(/\\r/g,'\\n').split('\\n').filter(l=>l.trim());\n  const headers = lines[0].split('\\t').map(h=>h.trim());\n  return lines.slice(1).map(line => {\n    const vals = line.split('\\t');\n    const obj = {};\n    headers.forEach((h,i) => obj[h] = (vals[i]||'').trim());\n    return obj;\n  }).filter(q => q.id && q.question);\n}\n\nfunction cleanAns(v) { return (v||'').trim().toUpperCase().replace(/[^A-D]/g,''); }\n\nfunction shuffle(arr) {\n  const a=[...arr];\n  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}\n  return a;\n}\n\nfunction genPin() { return Math.floor(1000+Math.random()*9000).toString(); }\n\nasync function loadQs() {\n  try {\n    const [r1,r2] = await Promise.all([\n      fetch(TSV_CB).then(r=>r.text()),\n      fetch(TSV_NC).then(r=>r.text())\n    ]);\n    qBank.cb = parseTSV(r1);\n    qBank.nc = parseTSV(r2);\n    qBank.cb.forEach(q => q.answer = cleanAns(q.answer));\n    qBank.nc.forEach(q => q.answer = cleanAns(q.answer));\n    return true;\n  } catch(e) {\n    showToast('❌ Lỗi tải câu hỏi: '+e.message);\n    return false;\n  }\n}\n\nfunction buildSessQs() {\n  const cb = shuffle(qBank.cb).slice(0,8).map(q=>({...q,_type:'basic'}));\n  const nc = shuffle(qBank.nc).slice(0,2).map(q=>({...q,_type:'advanced'}));\n  return shuffle([...cb,...nc]);\n}\n\nasync function init() {\n  showScreen('s-loading');\n  pin = genPin();\n\n  const ok = await loadQs();\n  if (!ok) return;\n\n  // Multi-room: chỉ xóa data của pin hiện tại (gần như chắc chắn rỗng vì pin random)\n  await Promise.all([\n    db.from('players').delete().eq('pin', pin),\n    db.from('answers').delete().eq('pin', pin),\n    db.from('game_state').delete().eq('id', pin)\n  ]);\n\n  const {error} = await db.from('game_state').upsert({\n    id:pin, status:'lobby', session:1,\n    question_index:0, pin:pin,\n    session_questions:null,\n    countdown_started_at:null,\n    question_started_at:null\n  });\n\n  if (error) {\n    showToast('❌ Lỗi khởi tạo: ' + error.message);\n    return;\n  }\n\n  document.getElementById('pin-num').textContent = pin;\n  const base = window.location.href.replace('host.html','player.html');\n  document.getElementById('pin-url').textContent = base + '?pin=' + pin;\n  showToast(`✅ Tải xong · ${qBank.cb.length} câu cơ bản · ${qBank.nc.length} câu nâng cao`);\n\n  showScreen('s-lobby');\n  startLobbyPoll();\n}\n\nfunction startLobbyPoll() {\n  clearInterval(pollInt);\n  pollInt = setInterval(async () => {\n    const {data} = await db.from('players').select('*').eq('pin', pin).order('joined_at');\n    if (data) { players=data; renderPlayers(data); }\n  }, 2000);\n}\n\nfunction renderPlayers(list) {\n  document.getElementById('pgrid').innerHTML =\n    list.map(p=>`<div class=\"chip\">👤 ${p.name}<\u002Fdiv>`).join('');\n  document.getElementById('pcnt').textContent = `${list.length} người chơi`;\n  document.getElementById('btn-start').disabled = list.length === 0;\n}\n\nasync function startSession(sess) {\n  curSess=sess; curIdx=0;\n  sessQs = buildSessQs();\n  clearInterval(pollInt);\n  document.getElementById('badge').textContent = `SESSION ${sess}`;\n  await pushCountdown(0);\n}\n\nasync function pushCountdown(idx) {\n  const now = new Date().toISOString();\n  await db.from('game_state').upsert({\n    id:pin, status:'countdown',\n    session:curSess, question_index:idx,\n    session_questions:sessQs,\n    countdown_started_at:now,\n    question_started_at:null\n  });\n  showCountdown(idx);\n}\n\nfunction showCountdown(idx) {\n  const q = sessQs[idx];\n  const adv = q._type==='advanced';\n  document.getElementById('cd-info').textContent = `Câu ${idx+1}/10 · ${adv?'⭐ Nâng cao':'Cơ bản'}`;\n  showScreen('s-cd');\n  let c = CD_SECS;\n  document.getElementById('cd-num').textContent = c;\n  clearInterval(cdInt);\n  cdInt = setInterval(async () => {\n    c--;\n    document.getElementById('cd-num').textContent = c > 0 ? c : '▶';\n    if (c <= 0) {\n      clearInterval(cdInt);\n      const qStart = new Date().toISOString();\n      await db.from('game_state').upsert({id:pin,status:'question',question_started_at:qStart});\n      showQ(idx);\n    }\n  }, 1000);\n}\n\nfunction showQ(idx) {\n  curIdx=idx;\n  const q=sessQs[idx], adv=q._type==='advanced';\n  document.getElementById('qcnt').textContent = `CÂU ${idx+1} / 10`;\n  document.getElementById('qtag').textContent = adv?'⭐ NÂNG CAO':'CƠ BẢN';\n  document.getElementById('qtag').className   = `qtag ${adv?'adv':'basic'}`;\n  document.getElementById('qtxt').textContent = q.question;\n  document.getElementById('a-A').textContent  = q.A;\n  document.getElementById('a-B').textContent  = q.B;\n  document.getElementById('a-C').textContent  = q.C;\n  document.getElementById('a-D').textContent  = q.D;\n  document.getElementById('s-total').textContent = players.length;\n  document.getElementById('s-ans').textContent   = '0';\n  document.getElementById('s-rem').textContent   = players.length;\n  showScreen('s-q');\n  startTimer(); pollAns();\n}\n\nfunction pollAns() {\n  clearInterval(ansInt);\n  ansInt = setInterval(async () => {\n    const {data} = await db.from('answers')\n      .select('*').eq('pin',pin).eq('session',curSess).eq('question_index',curIdx);\n    if (!data) return;\n    document.getElementById('s-ans').textContent = data.length;\n    document.getElementById('s-rem').textContent = Math.max(0,players.length-data.length);\n    if (data.length>=players.length && players.length>0) { clearInterval(ansInt); endQ(); }\n  }, 1000);\n}\n\nfunction startTimer() {\n  tLeft=15; clearInterval(timerInt);\n  const bar=document.getElementById('tbar'), num=document.getElementById('tnum');\n  bar.style.width='100%'; bar.className='tbar'; num.className='tnum';\n  timerInt = setInterval(()=>{\n    tLeft--;\n    bar.style.width=(tLeft/15*100)+'%'; num.textContent=tLeft;\n    if(tLeft<=5){bar.className='tbar warn';num.className='tnum warn';}\n    if(tLeft<=0){clearInterval(timerInt);clearInterval(ansInt);endQ();}\n  },1000);\n}\n\nasync function endQ() {\n  clearInterval(timerInt); clearInterval(ansInt);\n  await db.from('game_state').upsert({id:pin,status:'result'});\n  const {data:ans} = await db.from('answers')\n    .select('*').eq('pin',pin).eq('session',curSess).eq('question_index',curIdx);\n  const {data:lb} = await db.from('players').select('*').eq('pin',pin).order('score',{ascending:false});\n  showScreen('s-result');\n  renderDist(ans||[]);\n  await renderLB(lb||[],'lb-mid');\n  const lastQ=curIdx>=9, lastS=curSess>=2;\n  const btn=document.getElementById('btn-next');\n  if(lastQ&&lastS)   btn.textContent='🏆 Xem kết quả cuối cùng';\n  else if(lastQ)     btn.textContent='🚀 Bắt đầu Session 2';\n  else               btn.textContent=`Câu tiếp theo ▶ (${curIdx+2}/10) · 8s`;\n  // Auto-next 8 giây — chỉ áp dụng giữa các câu trong cùng session\n  if(!lastQ){startAutoNext(8);}\n}\n\nlet autoNextInt=null;\nfunction startAutoNext(sec){\n  clearInterval(autoNextInt);\n  const btn=document.getElementById('btn-next');\n  let left=sec;\n  autoNextInt=setInterval(()=>{\n    left--;\n    if(left<=0){\n      clearInterval(autoNextInt);autoNextInt=null;\n      btn.textContent='Đang chuyển câu...';\n      nextQ();\n    } else {\n      btn.textContent=`Câu tiếp theo ▶ (${curIdx+2}/10) · ${left}s`;\n    }\n  },1000);\n}\nfunction stopAutoNext(){\n  if(autoNextInt){clearInterval(autoNextInt);autoNextInt=null;}\n}\n\nfunction renderDist(ans) {\n  const c={A:0,B:0,C:0,D:0};\n  ans.forEach(a=>{if(a.answer in c)c[a.answer]++;});\n  const max=Math.max(...Object.values(c),1);\n  ['A','B','C','D'].forEach(k=>{\n    document.getElementById(`bar-${k}`).style.height=(c[k]/max*100)+'%';\n    document.getElementById(`cnt-${k}`).textContent=c[k];\n  });\n}\n\nasync function renderLB(list,id) {\n  const ranks=['🥇','🥈','🥉'],rc=['gold','silver','bronze'];\n  const {data:allAns}=await db.from('answers').select('player_id,answered_at').eq('pin',pin);\n  const tmap={};\n  (allAns||[]).forEach(a=>{tmap[a.player_id]=(tmap[a.player_id]||0)+(a.answered_at||0);});\n  document.getElementById(id).innerHTML=list.slice(0,20).map((p,i)=>`\n    <div class=\"lbrow\">\n      <div class=\"lbrank ${rc[i]||''}\">${ranks[i]||i+1}<\u002Fdiv>\n      <div class=\"lbname\">${p.name}<\u002Fdiv>\n      <div class=\"lbscore\">${p.score.toFixed(2)}<\u002Fdiv>\n      <div class=\"lbtime\">⏱ ${tmap[p.id]?tmap[p.id].toFixed(1)+'s':'—'}<\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\nasync function nextQ() {\n  stopAutoNext();\n  const lastQ=curIdx>=9, lastS=curSess>=2;\n  if(lastQ&&lastS){showFinal();return;}\n  if(lastQ){\n    showScreen('s-lobby');\n    document.getElementById('badge').textContent='NGHỈ GIẢI LAO';\n    const btn=document.getElementById('btn-start');\n    btn.textContent='🚀 Bắt đầu Session 2';\n    btn.onclick=()=>startSession(2); btn.disabled=false;\n    renderPlayers(players); return;\n  }\n  await pushCountdown(curIdx+1);\n}\n\nasync function showFinal() {\n  await db.from('game_state').upsert({id:pin,status:'final'});\n  const {data:lb}=await db.from('players').select('*').eq('pin',pin).order('score',{ascending:false});\n  showScreen('s-final');\n  await renderLB(lb||[],'lb-final');\n}\n\nasync function exportCSV() {\n  const {data:pList}=await db.from('players').select('*').eq('pin',pin).order('score',{ascending:false});\n  const {data:ans}=await db.from('answers').select('*').eq('pin',pin);\n  const tmap={};\n  (ans||[]).forEach(a=>{tmap[a.player_id]=(tmap[a.player_id]||0)+(a.answered_at||0);});\n  const rows=[['Thứ hạng','Họ và Tên','Tổng điểm','Tổng thời gian (giây)']];\n  (pList||[]).forEach((p,i)=>{rows.push([i+1,p.name,p.score.toFixed(2),(tmap[p.id]||0).toFixed(1)]);});\n  const csv=rows.map(r=>r.map(v=>`\"${v}\"`).join(',')).join('\\n');\n  const blob=new Blob(['\\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);\n  a.download=`SHB_Quiz_PIN${pin}_${new Date().toLocaleDateString('vi-VN').replace(/\\//g,'-')}.csv`;\n  a.click(); showToast('✅ Xuất file thành công!');\n}\n\nasync function resetGame() {\n  await Promise.all([\n    db.from('players').delete().eq('pin', pin),\n    db.from('answers').delete().eq('pin', pin),\n    db.from('game_state').delete().eq('id', pin)\n  ]);\n  window.location.reload();\n}\n\nfunction showScreen(id) {\n  ['s-loading','s-lobby','s-cd','s-q','s-result','s-final'].forEach(s=>{\n    document.getElementById(s).style.display='none';\n  });\n  document.getElementById(id).style.display=(id==='s-lobby'||id==='s-loading')?'flex':'block';\n}\n\nfunction showToast(msg) {\n  const t=document.getElementById('toast');\n  t.textContent=msg; t.classList.add('show');\n  setTimeout(()=>t.classList.remove('show'),3000);\n}\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
